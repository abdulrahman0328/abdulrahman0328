<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420"
     font-family="'JetBrains Mono','Fira Code',ui-monospace,'SF Mono',Menlo,Consolas,monospace">
  <defs>
    <style>
      .c { fill: #6a9955; }
      .k { fill: #569cd6; }
      .v { fill: #9cdcfe; }
      .n { fill: #b5cea8; }
      .f { fill: #dcdcaa; }
      .s { fill: #ce9178; }
      .o { fill: #d4d4d4; }
      .p { fill: #4ec9b0; }
      .g { fill: #c586c0; }
    </style>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0d1117"/>
      <stop offset="55%"  stop-color="#0b1a2e"/>
      <stop offset="100%" stop-color="#0d2038"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%"   stop-color="#1f6feb" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="centerFade" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#0d1117" stop-opacity="0.97"/>
      <stop offset="48%"  stop-color="#0d1117" stop-opacity="0.84"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#58a6ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>

    <filter id="nameGlow" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="subtitleGlow" x="-5%" y="-60%" width="110%" height="220%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- مسارات القص لمحاكاة الكتابة الفعلية - تم تعديل التوقيت لـ 15 ثانية -->
    <clipPath id="clip1">
      <rect x="410" y="200" height="100" width="0">
        <animate attributeName="width" values="0;385;385;0;0" keyTimes="0; 0.08; 0.23; 0.266; 1" dur="15s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="clip2">
      <rect x="380" y="200" height="100" width="0">
        <animate attributeName="width" values="0;0;445;445;0;0" keyTimes="0; 0.266; 0.346; 0.496; 0.533; 1" dur="15s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="clip3">
      <rect x="180" y="200" height="100" width="0">
        <animate attributeName="width" values="0;0;830;830;0" keyTimes="0; 0.533; 0.65; 0.96; 1" dur="15s" repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <!-- ══ CODE BLOCK ══ -->
    <g id="codeBlock" font-size="12" font-weight="500" letter-spacing="0.3" opacity="0.52">
      <!-- Line 1 -->
      <text class="c" x="20"  y="16">-- Data Job Market Analysis · 2024</text>
      <text class="k" x="590" y="16">SELECT</text>
      <text class="f" x="646" y="16"> job_title</text>
      <text class="o" x="736" y="16">,</text>
      <text class="f" x="752" y="16">COUNT</text>
      <text class="o" x="800" y="16">(*) AS</text>
      <text class="v" x="848" y="16"> job_count</text>

      <!-- Line 2 -->
      <text class="k" x="20"  y="46">SELECT</text>
      <text class="v" x="76"  y="46"> job_title</text>
      <text class="o" x="162" y="46">,</text>
      <text class="f" x="178" y="46">MEDIAN</text>
      <text class="o" x="234" y="46">(</text>
      <text class="v" x="242" y="46">yearly_salary</text>
      <text class="o" x="350" y="46">) AS</text>
      <text class="v" x="388" y="46"> median_sal</text>
      <text class="c" x="660" y="46">-- 479K total postings</text>

      <!-- Line 3 -->
      <text class="k" x="20"  y="76">FROM</text>
      <text class="v" x="64"  y="76"> data_jobs</text>
      <text class="k" x="204" y="76">WHERE</text>
      <text class="v" x="254" y="76"> year</text>
      <text class="o" x="298" y="76"> =</text>
      <text class="n" x="314" y="76"> 2024</text>
      <text class="k" x="620" y="76">GROUP BY</text>
      <text class="v" x="704" y="76"> job_title</text>
      <text class="k" x="900" y="76">ORDER BY</text>
      <text class="n" x="984" y="76"> 2 DESC</text>

      <!-- Line 4 -->
      <text class="c" x="20"  y="106">-- Result: Data Analyst $90K · Data Engineer $126K · ML Engineer $155K</text>

      <!-- Line 5 — DAX -->
      <text class="c" x="20"  y="136">-- DAX: KPI Measures</text>
      <text class="p" x="590" y="136">Median Salary</text>
      <text class="o" x="700" y="136"> =</text>
      <text class="f" x="720" y="136">MEDIAN</text>
      <text class="o" x="776" y="136">(</text>
      <text class="v" x="784" y="136">Jobs</text>
      <text class="o" x="820" y="136">[</text>
      <text class="v" x="828" y="136">yearly_salary</text>
      <text class="o" x="934" y="136">])</text>

      <!-- Line 6 -->
      <text class="p" x="20"  y="166">Job Count</text>
      <text class="o" x="100" y="166"> =</text>
      <text class="f" x="120" y="166">COUNTROWS</text>
      <text class="o" x="210" y="166">(</text>
      <text class="v" x="218" y="166">data_jobs</text>
      <text class="o" x="292" y="166">)</text>
      <text class="c" x="620" y="166">-- 32,600 valid records</text>

      <!-- Line 7 -->
      <text class="p" x="20"  y="196">Star Rating</text>
      <text class="o" x="116" y="196"> =</text>
      <text class="f" x="136" y="196">SWITCH</text>
      <text class="o" x="188" y="196">(</text>
      <text class="k" x="196" y="196">TRUE</text>
      <text class="o" x="232" y="196">(),</text>
      <text class="v" x="590" y="196">salary_rank</text>
      <text class="o" x="682" y="196"> &lt;=</text>
      <text class="n" x="712" y="196"> 0.2</text>
      <text class="o" x="744" y="196">,</text>
      <text class="n" x="760" y="196"> 5</text>
      <text class="o" x="778" y="196">, ... )</text>

      <!-- Line 8 — Power Query -->
      <text class="c" x="20"  y="226">-- Power Query: clean pipeline</text>
      <text class="k" x="590" y="226">let</text>
      <text class="v" x="618" y="226"> Source</text>
      <text class="o" x="672" y="226"> =</text>
      <text class="f" x="690" y="226"> Excel.Workbook</text>
      <text class="o" x="808" y="226">(file)</text>

      <!-- Line 9 -->
      <text class="v" x="20"  y="256">CleanSalary</text>
      <text class="o" x="114" y="256"> =</text>
      <text class="f" x="134" y="256">Table.TransformColumns</text>
      <text class="o" x="310" y="256">(</text>
      <text class="v" x="318" y="256">Source</text>
      <text class="o" x="368" y="256">, {{</text>
      <text class="s" x="404" y="256">"salary"</text>
      <text class="o" x="460" y="256">,</text>
      <text class="f" x="476" y="256"> Number.From</text>
      <text class="o" x="570" y="256">}})</text>
      <text class="c" x="700" y="256">-- removes nulls</text>

      <!-- Line 10 -->
      <text class="v" x="20"  y="286">FilteredRows</text>
      <text class="o" x="122" y="286"> =</text>
      <text class="f" x="142" y="286">Table.SelectRows</text>
      <text class="o" x="270" y="286">(</text>
      <text class="v" x="278" y="286">CleanSalary</text>
      <text class="o" x="368" y="286">,</text>
      <text class="k" x="384" y="286"> each</text>
      <text class="o" x="420" y="286"> [</text>
      <text class="v" x="430" y="286">salary</text>
      <text class="o" x="476" y="286">] &gt;</text>
      <text class="n" x="504" y="286"> 0</text>
      <text class="o" x="524" y="286">)</text>
      <text class="c" x="700" y="286">-- 40% faster reporting</text>

      <!-- Line 11 — Python -->
      <text class="c" x="20"  y="316">-- Python: automated modeling</text>
      <text class="k" x="590" y="316">import</text>
      <text class="v" x="646" y="316"> pandas </text>
      <text class="k" x="706" y="316">as</text>
      <text class="v" x="730" y="316"> pd</text>

      <!-- Line 12 -->
      <text class="v" x="20"  y="346">df</text>
      <text class="o" x="44"  y="346"> =</text>
      <text class="v" x="68"  y="346"> pd</text>
      <text class="o" x="92"  y="346">.</text>
      <text class="f" x="100" y="346">read_csv</text>
      <text class="o" x="164" y="346">(</text>
      <text class="s" x="172" y="346">"data_jobs.csv"</text>
      <text class="o" x="292" y="346">)</text>
      <text class="c" x="620" y="346">-- dynamic data load</text>

      <!-- Line 13 -->
      <text class="v" x="20"  y="376">clean_df</text>
      <text class="o" x="84"  y="376"> =</text>
      <text class="v" x="108" y="376"> df</text>
      <text class="o" x="132" y="376">.</text>
      <text class="f" x="140" y="376">dropna</text>
      <text class="o" x="188" y="376">()</text>
      <text class="c" x="620" y="376">-- 479K rows processed</text>

      <!-- Line 14 -->
      <text class="f" x="20"  y="406">print</text>
      <text class="o" x="62"  y="406">(</text>
      <text class="s" x="70"  y="406">f"Processed {</text>
      <text class="f" x="178" y="406">len</text>
      <text class="o" x="202" y="406">(</text>
      <text class="v" x="210" y="406">clean_df</text>
      <text class="o" x="274" y="406">)}</text>
      <text class="s" x="290" y="406"> rows"</text>
      <text class="o" x="338" y="406">)</text>
    </g>
  </defs>

  <!-- ══ BACKGROUND ══ -->
  <rect width="1200" height="420" fill="url(#bg)"/>
  <ellipse cx="600" cy="210" rx="600" ry="210" fill="url(#glow)"/>

  <!-- ══ TERMINAL BAR ══ -->
  <rect width="1200" height="42" fill="#161b22"/>
  <line x1="0" y1="42" x2="1200" y2="42" stroke="#30363d" stroke-width="1"/>
  <text x="20" y="26" fill="#8b949e" font-size="12" font-weight="500" letter-spacing="0.5">abdo_datanerd.sql</text>
  <text x="1180" y="26" text-anchor="end" fill="#3fb950" font-size="11.5" font-weight="500" letter-spacing="0.5">● connected</text>

  <!-- ══ SCROLLING CODE ══ -->
  <g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,42; 0,-378" dur="28s" repeatCount="indefinite" calcMode="linear"/>
      <use href="#codeBlock"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,462; 0,42" dur="28s" repeatCount="indefinite" calcMode="linear"/>
      <use href="#codeBlock"/>
    </g>
  </g>

  <!-- ══ CENTER FADE ══ -->
  <ellipse cx="600" cy="210" rx="580" ry="180" fill="url(#centerFade)"/>

  <!-- ══ NAME ══ -->
  <text x="600" y="184" text-anchor="middle" fill="#ffffff" font-size="64" font-weight="800" letter-spacing="3.5" filter="url(#nameGlow)" opacity="0">
    ABDULRAHMAN MUHAMMAD
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.3s" fill="freeze"/>
  </text>

  <!-- ══ DIVIDER ══ -->
  <line x1="260" y1="218" x2="940" y2="218" stroke="url(#lineGrad)" stroke-width="1.2" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.9s" fill="freeze"/>
  </line>

  <!-- ══ SUBTITLE (TYPEWRITER EFFECT) ══ -->
  <g font-weight="600" filter="url(#subtitleGlow)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.1s" fill="freeze"/>

    <!-- 1: JUNIOR DATA ANALYST -->
    <text x="415" y="264" fill="#79c0ff" clip-path="url(#clip1)" text-anchor="start" font-size="21" letter-spacing="7">
      JUNIOR DATA ANALYST
    </text>
    <g opacity="0">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0; 0.265; 0.266; 1" dur="15s" repeatCount="indefinite"/>
      <text y="264" fill="#58a6ff" font-weight="700" font-size="22" text-anchor="start">_
        <animate attributeName="x" values="415;795;795;415;415" keyTimes="0; 0.08; 0.23; 0.266; 1" dur="15s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- 2: EXCEL · POWER BI · SQL -->
    <text x="385" y="264" fill="#58a6ff" clip-path="url(#clip2)" text-anchor="start" font-size="21" letter-spacing="7">
      EXCEL · POWER BI · SQL
    </text>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0; 0.265; 0.266; 0.532; 0.533; 1" dur="15s" repeatCount="indefinite"/>
      <text y="264" fill="#58a6ff" font-weight="700" font-size="22" text-anchor="start">_
        <animate attributeName="x" values="385;385;825;825;385;385" keyTimes="0; 0.266; 0.346; 0.496; 0.533; 1" dur="15s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- 3: THE LONG QUOTE (Larger & Longer Display) -->
    <text x="195" y="264" fill="#a5d6ff" clip-path="url(#clip3)" text-anchor="start" font-size="18" letter-spacing="2">
      DATA IS THE NEW LANGUAGE OF BUSINESS — AND I SPEAK IT FLUENTLY
    </text>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0; 0.532; 0.533; 1" dur="15s" repeatCount="indefinite"/>
      <text y="264" fill="#58a6ff" font-weight="700" font-size="20" text-anchor="start">_
        <animate attributeName="x" values="190;190;1005;1005;190" keyTimes="0; 0.533; 0.65; 0.96; 1" dur="15s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
      </text>
    </g>
  </g>

  <!-- ══ SKILLS ROW (Updated Background) ══ -->
  <a href="https://abdodatanerd.figma.site/" target="_blank">
    <g text-anchor="middle" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.5s" fill="freeze"/>
      <rect x="160" y="284" width="880" height="30" fill="transparent" rx="4"/>
      <text x="600" y="306" fill="#8b949e" font-size="14" font-weight="400" letter-spacing="3">
        Excel  ·  Power BI  ·  SQL  ·  Business &amp; Financial Background
      </text>
      <line x1="200" y1="314" x2="1000" y2="314" stroke="#30363d" stroke-width="0.8"/>
    </g>
  </a>

  <!-- ══ OPEN TO WORK BADGE ══ -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.9s" fill="freeze"/>
    <rect x="480" y="330" width="240" height="30" rx="15" fill="none" stroke="#238636" stroke-width="1.2"/>
    <circle cx="502" cy="345" r="4.5" fill="#3fb950">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="600" y="350" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="600" letter-spacing="1.5">
      OPEN TO WORK
    </text>
  </g>
</svg>
