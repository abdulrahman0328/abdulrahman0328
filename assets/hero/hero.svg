<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520"
     font-family="'JetBrains Mono','Fira Code',ui-monospace,'SF Mono',Menlo,Consolas,monospace">
  <defs>
    <style>
      .c { fill: #6a9955; }
      .k { fill: #569cd6; }
      .v { fill: #9cdcfe; }
      .n { fill: #b5cea8; }
      .f { fill: #dcdcaa; }
      .s { fill: #ce9178; }
      .o { fill: #d4d4d4; }
      .p { fill: #4ec9b0; }
      .g { fill: #c586c0; }
    </style>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0d1117"/>
      <stop offset="55%"  stop-color="#0b1a2e"/>
      <stop offset="100%" stop-color="#0d2038"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%"   stop-color="#1f6feb" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="centerFade" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#0d1117" stop-opacity="0.98"/>
      <stop offset="52%"  stop-color="#0d1117" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#58a6ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>

    <filter id="nameGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="4.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="subtitleGlow" x="-10%" y="-60%" width="120%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- مسارات القص محسوبة بدقة للمركز -->
    <clipPath id="clip1">
      <rect x="393" y="240" height="100" width="0">
        <animate attributeName="width" values="0;425;425;0;0" keyTimes="0; 0.08; 0.23; 0.266; 1" dur="15s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="clip2">
      <rect x="360" y="240" height="100" width="0">
        <animate attributeName="width" values="0;0;495;495;0;0" keyTimes="0; 0.266; 0.346; 0.496; 0.533; 1" dur="15s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="clip3">
      <rect x="129" y="240" height="100" width="0">
        <animate attributeName="width" values="0;0;955;955;0" keyTimes="0; 0.533; 0.65; 0.96; 1" dur="15s" repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <!-- ══ CODE BLOCK ══ -->
    <g id="codeBlock" font-size="13" font-weight="500" letter-spacing="0.3" opacity="0.48">
      <text class="c" x="20"  y="18">-- Data Job Market Analysis · 2024</text>
      <text class="k" x="590" y="18">SELECT</text>
      <text class="f" x="646" y="18"> job_title</text>
      <text class="o" x="736" y="18">,</text>
      <text class="f" x="752" y="18">COUNT</text>
      <text class="o" x="800" y="18">(*) AS</text>
      <text class="v" x="848" y="18"> job_count</text>
      <text class="k" x="20"  y="50">SELECT</text>
      <text class="v" x="76"  y="50"> job_title</text>
      <text class="o" x="162" y="50">,</text>
      <text class="f" x="178" y="50">MEDIAN</text>
      <text class="o" x="234" y="50">(</text>
      <text class="v" x="242" y="50">yearly_salary</text>
      <text class="o" x="350" y="50">) AS</text>
      <text class="v" x="388" y="50"> median_sal</text>
      <text class="c" x="660" y="50">-- 479K total postings</text>
      <text class="k" x="20"  y="82">FROM</text>
      <text class="v" x="64"  y="82"> data_jobs</text>
      <text class="k" x="204" y="82">WHERE</text>
      <text class="v" x="254" y="82"> year</text>
      <text class="o" x="298" y="82"> =</text>
      <text class="n" x="314" y="82"> 2024</text>
      <text class="k" x="620" y="82">GROUP BY</text>
      <text class="v" x="704" y="82"> job_title</text>
      <text class="k" x="900" y="82">ORDER BY</text>
      <text class="n" x="984" y="82"> 2 DESC</text>
      <text class="c" x="20"  y="114">-- Result: Data Analyst $90K · Data Engineer $126K · ML Engineer $155K</text>
      <text class="c" x="20"  y="146">-- DAX: KPI Measures</text>
      <text class="p" x="590" y="146">Median Salary</text>
      <text class="o" x="700" y="146"> =</text>
      <text class="f" x="720" y="146">MEDIAN</text>
      <text class="o" x="776" y="146">(</text>
      <text class="v" x="784" y="146">Jobs</text>
      <text class="o" x="820" y="146">[</text>
      <text class="v" x="828" y="146">yearly_salary</text>
      <text class="o" x="934" y="146">])</text>
      <text class="p" x="20"  y="178">Job Count</text>
      <text class="o" x="100" y="178"> =</text>
      <text class="f" x="120" y="178">COUNTROWS</text>
      <text class="o" x="210" y="178">(</text>
      <text class="v" x="218" y="178">data_jobs</text>
      <text class="o" x="292" y="178">)</text>
      <text class="c" x="620" y="178">-- 32,600 valid records</text>
      <text class="p" x="20"  y="210">Star Rating</text>
      <text class="o" x="116" y="210"> =</text>
      <text class="f" x="136" y="210">SWITCH</text>
      <text class="o" x="188" y="210">(</text>
      <text class="k" x="196" y="210">TRUE</text>
      <text class="o" x="232" y="210">(),</text>
      <text class="v" x="590" y="210">salary_rank</text>
      <text class="o" x="682" y="210"> &lt;=</text>
      <text class="n" x="712" y="210"> 0.2</text>
      <text class="o" x="744" y="210">,</text>
      <text class="n" x="760" y="210"> 5</text>
      <text class="o" x="778" y="210">, ... )</text>
      <text class="c" x="20"  y="242">-- Power Query: clean pipeline</text>
      <text class="k" x="590" y="242">let</text>
      <text class="v" x="618" y="242"> Source</text>
      <text class="o" x="672" y="242"> =</text>
      <text class="f" x="690" y="242"> Excel.Workbook</text>
      <text class="o" x="808" y="242">(file)</text>
      <text class="v" x="20"  y="274">CleanSalary</text>
      <text class="o" x="114" y="274"> =</text>
      <text class="f" x="134" y="274">Table.TransformColumns</text>
      <text class="o" x="310" y="274">(</text>
      <text class="v" x="318" y="274">Source</text>
      <text class="o" x="368" y="274">, {{</text>
      <text class="s" x="404" y="274">"salary"</text>
      <text class="o" x="460" y="274">,</text>
      <text class="f" x="476" y="274"> Number.From</text>
      <text class="o" x="570" y="274">}})</text>
      <text class="c" x="700" y="274">-- removes nulls</text>
      <text class="v" x="20"  y="306">FilteredRows</text>
      <text class="o" x="122" y="306"> =</text>
      <text class="f" x="142" y="306">Table.SelectRows</text>
      <text class="o" x="270" y="306">(</text>
      <text class="v" x="278" y="306">CleanSalary</text>
      <text class="o" x="368" y="306">,</text>
      <text class="k" x="384" y="306"> each</text>
      <text class="o" x="420" y="306"> [</text>
      <text class="v" x="430" y="306">salary</text>
      <text class="o" x="476" y="306">] &gt;</text>
      <text class="n" x="504" y="306"> 0</text>
      <text class="o" x="524" y="306">)</text>
      <text class="c" x="700" y="306">-- 40% faster reporting</text>
      <text class="c" x="20"  y="338">-- Python: automated modeling</text>
      <text class="k" x="590" y="338">import</text>
      <text class="v" x="646" y="338"> pandas </text>
      <text class="k" x="706" y="338">as</text>
      <text class="v" x="730" y="338"> pd</text>
      <text class="v" x="20"  y="370">df</text>
      <text class="o" x="44"  y="370"> =</text>
      <text class="v" x="68"  y="370"> pd</text>
      <text class="o" x="92"  y="370">.</text>
      <text class="f" x="100" y="370">read_csv</text>
      <text class="o" x="164" y="370">(</text>
      <text class="s" x="172" y="370">"data_jobs.csv"</text>
      <text class="o" x="292" y="370">)</text>
      <text class="c" x="620" y="370">-- dynamic data load</text>
      <text class="v" x="20"  y="402">clean_df</text>
      <text class="o" x="84"  y="402"> =</text>
      <text class="v" x="108" y="402"> df</text>
      <text class="o" x="132" y="402">.</text>
      <text class="f" x="140" y="402">dropna</text>
      <text class="o" x="188" y="402">()</text>
      <text class="c" x="620" y="402">-- 479K rows processed</text>
      <text class="f" x="20"  y="434">print</text>
      <text class="o" x="62"  y="434">(</text>
      <text class="s" x="70"  y="434">f"Processed {</text>
      <text class="f" x="178" y="434">len</text>
      <text class="o" x="202" y="434">(</text>
      <text class="v" x="210" y="434">clean_df</text>
      <text class="o" x="274" y="434">)}</text>
      <text class="s" x="290" y="434"> rows"</text>
      <text class="o" x="338" y="434">)</text>
      <text class="c" x="20"  y="466">-- Power BI Dashboard Layout &amp; DAX Optimization</text>
      <text class="k" x="590" y="466">EVALUATE</text>
      <text class="f" x="670" y="466"> CALCULATETABLE</text>
      <text class="o" x="800" y="466">(data_jobs)</text>
    </g>
  </defs>

  <!-- ══ BACKGROUND ══ -->
  <rect width="1200" height="520" fill="url(#bg)"/>
  <ellipse cx="600" cy="260" rx="600" ry="260" fill="url(#glow)"/>

  <!-- ══ TERMINAL BAR ══ -->
  <rect width="1200" height="46" fill="#161b22"/>
  <line x1="0" y1="46" x2="1200" y2="46" stroke="#30363d" stroke-width="1"/>
  <text x="24" y="28" fill="#8b949e" font-size="13" font-weight="500" letter-spacing="0.5">abdo_datanerd.sql</text>
  <text x="1176" y="28" text-anchor="end" fill="#3fb950" font-size="12" font-weight="500" letter-spacing="0.5">● connected</text>

  <!-- ══ SCROLLING CODE ══ -->
  <g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,46; 0,-434" dur="28s" repeatCount="indefinite" calcMode="linear"/>
      <use href="#codeBlock"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,526; 0,46" dur="28s" repeatCount="indefinite" calcMode="linear"/>
      <use href="#codeBlock"/>
    </g>
  </g>

  <!-- ══ CENTER FADE ══ -->
  <ellipse cx="600" cy="270" rx="580" ry="220" fill="url(#centerFade)"/>

  <!-- ══ NAME ══ -->
  <text x="600" y="215" text-anchor="middle" fill="#ffffff" font-size="72" font-weight="800" letter-spacing="4" filter="url(#nameGlow)" opacity="0">
    ABDULRAHMAN MUHAMMAD
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.3s" fill="freeze"/>
  </text>

  <!-- ══ DIVIDER ══ -->
  <line x1="220" y1="250" x2="980" y2="250" stroke="url(#lineGrad)" stroke-width="1.5" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.9s" fill="freeze"/>
  </line>

  <!-- ══ SUBTITLE (TYPEWRITER EFFECT - CENTERED & UNIFIED) ══ -->
  <g font-weight="600" filter="url(#subtitleGlow)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.1s" fill="freeze"/>

    <!-- 1: JUNIOR DATA ANALYST -->
    <text x="393" y="300" fill="#79c0ff" clip-path="url(#clip1)" text-anchor="start" font-size="28" letter-spacing="5">
      JUNIOR DATA ANALYST
    </text>
    <g opacity="0">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0; 0.265; 0.266; 1" dur="15s" repeatCount="indefinite"/>
      <text y="302" fill="#79c0ff" font-weight="700" font-size="30" text-anchor="start">_
        <animate attributeName="x" values="393;807;807;393;393" keyTimes="0; 0.08; 0.23; 0.266; 1" dur="15s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- 2: EXCEL · POWER BI · SQL -->
    <text x="360" y="300" fill="#79c0ff" clip-path="url(#clip2)" text-anchor="start" font-size="28" letter-spacing="5">
      EXCEL · POWER BI · SQL
    </text>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0; 0.265; 0.266; 0.532; 0.533; 1" dur="15s" repeatCount="indefinite"/>
      <text y="302" fill="#79c0ff" font-weight="700" font-size="30" text-anchor="start">_
        <animate attributeName="x" values="360;360;840;840;360;360" keyTimes="0; 0.266; 0.346; 0.496; 0.533; 1" dur="15s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- 3: THE LONG QUOTE -->
    <text x="129" y="300" fill="#79c0ff" clip-path="url(#clip3)" text-anchor="start" font-size="22" letter-spacing="2">
      DATA IS THE NEW LANGUAGE OF BUSINESS — AND I SPEAK IT FLUENTLY
    </text>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0; 0.532; 0.533; 1" dur="15s" repeatCount="indefinite"/>
      <text y="302" fill="#79c0ff" font-weight="700" font-size="24" text-anchor="start">_
        <animate attributeName="x" values="129;129;1071;1071;129" keyTimes="0; 0.533; 0.65; 0.96; 1" dur="15s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
      </text>
    </g>
  </g>

  <!-- ══ SKILLS ROW ══ -->
  <a href="https://abdodatanerd.figma.site/" target="_blank">
    <g text-anchor="middle" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.5s" fill="freeze"/>
      <rect x="120" y="340" width="960" height="36" fill="transparent" rx="4"/>
      <text x="600" y="364" fill="#8b949e" font-size="17" font-weight="500" letter-spacing="3.5">
        Excel  ·  Power BI  ·  SQL  ·  Business &amp; Financial Background
      </text>
      <line x1="160" y1="376" x2="1040" y2="376" stroke="#30363d" stroke-width="1"/>
    </g>
  </a>

  <!-- ══ OPEN TO WORK BADGE ══ -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.9s" fill="freeze"/>
    <rect x="470" y="412" width="260" height="38" rx="19" fill="#0d1117" stroke="#238636" stroke-width="1.5"/>
    <circle cx="496" cy="431" r="5.5" fill="#3fb950">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="600" y="437" text-anchor="middle" fill="#3fb950" font-size="15" font-weight="700" letter-spacing="2">
      OPEN TO WORK
    </text>
  </g>
</svg>
